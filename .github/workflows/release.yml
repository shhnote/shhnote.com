# Builds the site whenever the `production` branch moves and publishes it as a GitHub
# release: the built `dist/` as a tarball, its SHA-256 checksum and a build provenance
# attestation. The release tag is created here, named by date and commit
# (`prod-2026-11-06-3f64968`); nobody tags by hand. There is no deploy step; the server
# pulls the latest release itself, and rolling back is pulling an earlier one.
name: release

on:
  push:
    branches: [production]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release, upload its files
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `production` only ever moves to a commit that is already on `main`, so nothing
      # reaches the release that did not go through `main` first.
      - name: Check that the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main; fast-forward production to a commit on main" >&2
            exit 1
          fi

      - name: Name the release
        id: name
        run: |
          short=$(git rev-parse --short=7 "$GITHUB_SHA")
          day=$(date -u +%Y-%m-%d)
          echo "tag=prod-$day-$short" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prebuild` runs scripts/fetch-upstream.sh. There is no checkout of the main
      # repository here, so it downloads docs.md from GitHub at the tag in .shhnote-ref.
      # The footer prints the commit the build was made from (src/lib/build.ts).
      - name: Build
        run: npm run build

      - name: Check for external URLs
        run: scripts/check-external.sh

      - name: Package
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          archive="shhnote.com-${TAG}.tar.gz"
          # Stable file order, owners and timestamps, so the same commit gives the same bytes.
          mtime=$(git log -1 --format=%cI)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="$mtime" \
            -C dist -cf - . | gzip -n -9 > "$archive"
          sha256sum "$archive" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: shhnote.com-${{ steps.name.outputs.tag }}.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest \
            "shhnote.com-${TAG}.tar.gz" SHA256SUMS
