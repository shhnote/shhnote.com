# Builds the site for a version tag and publishes it as a GitHub release: the built
# `dist/` as a tarball, its SHA-256 checksum and a build provenance attestation.
# There is no deploy step; the server pulls a release itself.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prebuild` runs scripts/fetch-upstream.sh. There is no checkout of the main
      # repository here, so it downloads docs.md from GitHub at the tag in .shhnote-ref.
      - name: Build
        run: npm run build

      - name: Check for external URLs
        run: scripts/check-external.sh

      - name: Package
        run: |
          archive="shhnote.com-${TAG}.tar.gz"
          # Stable file order, owners and timestamps, so the same commit gives the same bytes.
          mtime=$(git log -1 --format=%cI)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="$mtime" \
            -C dist -cf - . | gzip -n -9 > "$archive"
          sha256sum "$archive" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: shhnote.com-${{ github.ref_name }}.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            $prerelease \
            "shhnote.com-${TAG}.tar.gz" SHA256SUMS
